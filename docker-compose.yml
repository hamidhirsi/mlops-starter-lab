# Everything the two Airflow services share, written once. `&airflow-common`
# is a YAML anchor; `<<: *airflow-common` pastes it into a service. This is
# the same pattern the official Airflow compose file uses.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    # Tasks inside Airflow reach the tracking server over the compose network,
    # where its name is mlflow, not localhost.
    MLFLOW_TRACKING_URI: http://mlflow:5000
  # Your whole repository is mounted here so DAG tasks can run project code
  # with the same module paths you use on the host, for example
  # `python -m src.train`.
  working_dir: /opt/project
  volumes:
    - .:/opt/project
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs

services:
  postgres-mlflow:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - mlflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    # Exec form, one token per list element. A folded YAML scalar can mangle
    # a long command into something that parses but does the wrong thing.
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql://mlflow:mlflow@postgres-mlflow:5432/mlflow
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    environment:
      # MLflow 3 validates the Host header of every request and only trusts
      # localhost by default. Containers on this network reach the server as
      # mlflow:5000, so that name has to be trusted too, or every request from
      # Airflow comes back 403. Setting this REPLACES the defaults, so the
      # localhost forms must be listed as well.
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    # Container port 5000, host port 5001: macOS reserves 5000 for AirPlay.
    ports:
      - "5001:5000"
    volumes:
      - ./mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres-mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    # Prometheus scrapes your FastAPI service running on the HOST machine.
    # host.docker.internal exists out of the box on macOS and Windows; this
    # line makes it resolve on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres-airflow:
        condition: service_healthy
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
          (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true)"

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    command: webserver
    # Postgres can briefly refuse connections under memory pressure. Without
    # a restart policy that one blip leaves Airflow down for good.
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    command: scheduler
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  mlflow-postgres-data:
  airflow-postgres-data:
  airflow-logs:
  redis-data:
