global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Your FastAPI service, running on the host machine, not in Docker.
  # host.docker.internal is how a container reaches the host; the compose file
  # adds the mapping that makes this work on Linux as well.
  - job_name: "serving"
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
